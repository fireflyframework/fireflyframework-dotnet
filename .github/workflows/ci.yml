name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FireflyFramework.sln

      - name: Build
        run: dotnet build FireflyFramework.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test FireflyFramework.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/test-results.trx'

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack FireflyFramework.sln --configuration Release --output ./artifacts

      - name: Upload nupkgs
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
